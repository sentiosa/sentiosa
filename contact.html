  <main>
    <div class="contact">
      <h1 class="page__title">Let&rsquo;s work together</h1>

      <!-- SETUP: replace YOUR-ACCESS-KEY-HERE with the key Web3Forms emails you.
           Get one free at https://web3forms.com — enter your email, no account needed.
           The key is not a secret; it only routes messages to your inbox. -->
      <form id="contact-form" novalidate>
        <input type="hidden" name="access_key" value="YOUR-ACCESS-KEY-HERE">
        <input type="hidden" name="subject" value="New enquiry from sentiosa">
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">

        <div class="field">
          <label for="name">Your name</label>

        <div class="field">

<script src="site.js?v=20261001f" defer></script>

<script>
  var form = document.getElementById('contact-form');
  var status = document.getElementById('form-status');
  var btn = document.getElementById('submit-btn');

  function setErr(id, msg) {
    var el = document.getElementById('err-' + id);
    var input = document.getElementById(id);
    el.textContent = msg || '';
    if (msg) { input.classList.add('invalid'); } else { input.classList.remove('invalid'); }
    return !msg;
  }

  var emailInput = document.getElementById('email');
  var emailHint = document.getElementById('hint-email');

  // Structure: something before the @, a domain with at least one dot,
  // no empty labels, no spaces, and a TLD of at least two letters.
  var EMAIL_RE = /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[A-Za-z]{2,}$/;

  var TYPOS = {
    'gmail.co': 'gmail.com', 'gmial.com': 'gmail.com', 'gmai.com': 'gmail.com',
    'gmil.com': 'gmail.com', 'gmaill.com': 'gmail.com', 'gmail.cm': 'gmail.com',
    'hotmial.com': 'hotmail.com', 'hotmai.com': 'hotmail.com', 'hotmail.co': 'hotmail.com',
    'yahooo.com': 'yahoo.com', 'yaho.com': 'yahoo.com', 'yahoo.co': 'yahoo.com',
    'outlok.com': 'outlook.com', 'outlook.co': 'outlook.com',
    'iclod.com': 'icloud.com', 'icloud.co': 'icloud.com'
  };

  function emailProblem(v) {
    if (!v) return 'Enter your email address';
    if (v.indexOf('..') !== -1) return 'Enter a valid email address';
    if (!EMAIL_RE.test(v)) return 'Enter a valid email address';
    return '';
  }

  function checkTypo() {
    var v = emailInput.value.trim();
    var at = v.lastIndexOf('@');
    emailHint.innerHTML = '';
    if (at < 1) return;
    var domain = v.slice(at + 1).toLowerCase();
    var fix = TYPOS[domain];
    if (!fix) return;
    var corrected = v.slice(0, at + 1) + fix;
    emailHint.innerHTML = 'Did you mean <button type="button" class="hint-fix">' + corrected + '</button>?';
    emailHint.querySelector('.hint-fix').addEventListener('click', function () {
      emailInput.value = corrected;
      emailHint.innerHTML = '';
      setErr('email', '');
    });
  }

  emailInput.addEventListener('blur', checkTypo);

  ['name', 'email', 'message'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      setErr(id, '');
      if (id === 'email') emailHint.innerHTML = '';
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    status.textContent = '';
    status.className = 'form-status';

    var name = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim();
    var message = document.getElementById('message').value.trim();

    var ok = true;
    if (!setErr('name', name ? '' : 'Enter your name')) ok = false;
    if (!setErr('email', emailProblem(email))) ok = false;
    if (!setErr('message', message ? '' : 'Tell me a little about the project')) ok = false;
    checkTypo();
    if (!ok) { document.querySelector('.invalid').focus(); return; }

    btn.disabled = true;
    btn.textContent = 'Sending…';

    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(Object.fromEntries(new FormData(form)))
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.success) {
          form.style.display = 'none';
          status.textContent = 'Thank you — your message is on its way. I will get back to you soon.';
          status.className = 'form-status ok';
          status.style.display = 'block';
        } else {
          throw new Error('rejected');
        }
      })
      .catch(function () {
        status.textContent = 'That did not send. Please email bysentiosa@gmail.com instead.';
        status.className = 'form-status bad';
        btn.disabled = false;
        btn.textContent = 'Send message';
      });
  });
</script>
